<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="oneOneBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadowOneOne" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity="0.25"/>
    </filter>
  </defs>

  <ellipse cx="200" cy="345" rx="85" ry="15" fill="#000000" opacity="0.2"/>

  <!-- GÓI BÁNH GẠO ONE-ONE 150G BÒ NƯỚNG NGÔ -->
  <g filter="url(#shadowOneOne)">
    <!-- Túi bánh hình chữ nhật viền răng cưa -->
    <rect x="120" y="80" width="160" height="240" rx="8" fill="url(#oneOneBg)"/>

    <!-- Viền mép túi trên & dưới màu nâu đỏ -->
    <path d="M 120 80 L 280 80 L 280 95 L 120 95 Z" fill="#b45309"/>
    <path d="M 120 305 L 280 305 L 280 320 L 120 320 Z" fill="#b45309"/>

    <!-- LOGO ONE-ONE TRONG KHỐI ĐỎ NỔI BẬT -->
    <g transform="translate(200, 130)">
      <rect x="-60" y="-20" width="120" height="40" rx="20" fill="#dc2626" stroke="#ffffff" stroke-width="2.5"/>
      <text x="0" y="8" font-family="'Impact', Arial Black, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">ONE • ONE</text>
    </g>

    <text x="200" y="172" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="900" fill="#78350f" text-anchor="middle">BÁNH GẠO NƯỚNG</text>
    <rect x="140" y="178" width="120" height="18" rx="4" fill="#ea580c"/>
    <text x="200" y="191" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">VỊ BÒ NƯỚNG NGÔ</text>

    <!-- HÌNH CHIẾC BÁNH GẠO TRẮNG NGÀ GIÒN TAN HÌNH BẦU DỤC -->
    <g transform="translate(200, 245)">
      <!-- Chiếc bánh gạo phía sau nghiêng -->
      <ellipse cx="-15" cy="-5" rx="35" ry="45" fill="#f8fafc" stroke="#fef08a" stroke-width="2" transform="rotate(-15)"/>
      <circle cx="-25" cy="-20" r="2" fill="#d97706" opacity="0.6"/>
      <circle cx="-10" cy="-5" r="2.5" fill="#d97706" opacity="0.6"/>

      <!-- Chiếc bánh gạo phía trước tỏa sáng -->
      <ellipse cx="15" cy="5" rx="36" ry="46" fill="#ffffff" stroke="#fde047" stroke-width="3" transform="rotate(15)"/>
      <!-- Hạt nướng thơm chấm vàng -->
      <circle cx="10" cy="-10" r="2" fill="#b45309" opacity="0.7"/>
      <circle cx="25" cy="15" r="2" fill="#b45309" opacity="0.7"/>
      <circle cx="5" cy="20" r="2.5" fill="#b45309" opacity="0.7"/>
    </g>

    <text x="200" y="298" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#78350f" text-anchor="middle">KHÔNG CHIÊN QUA DẦU • 150g</text>
  </g>
</svg>