<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bottleLaVie" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="35%" stop-color="#e0f2fe"/>
      <stop offset="70%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="labelLaVie" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadowLaVie" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- BÓNG ĐỔ -->
  <ellipse cx="200" cy="350" rx="70" ry="12" fill="#000000" opacity="0.18"/>

  <g filter="url(#shadowLaVie)">
    <!-- NẮP CHAI XANH DƯƠNG -->
    <rect x="186" y="55" width="28" height="24" rx="4" fill="#0284c7"/>
    <line x1="186" y1="62" x2="214" y2="62" stroke="#0369a1" stroke-width="2"/>
    <line x1="186" y1="68" x2="214" y2="68" stroke="#0369a1" stroke-width="2"/>
    <ellipse cx="200" cy="55" rx="14" ry="4" fill="#38bdf8"/>

    <!-- CỔ CHAI TRONG SUỐT -->
    <path d="M 188 79 L 182 120 Q 155 145 155 180 L 155 315 Q 155 335 175 335 L 225 335 Q 245 335 245 315 L 245 180 Q 245 145 218 120 L 212 79 Z" fill="url(#bottleLaVie)" opacity="0.92"/>

    <!-- ĐƯỜNG GÂN CHAI KHOÁNG -->
    <path d="M 158 190 Q 200 198 242 190" stroke="#bae6fd" stroke-width="3" fill="none"/>
    <path d="M 158 290 Q 200 298 242 290" stroke="#bae6fd" stroke-width="3" fill="none"/>

    <!-- NHÃN CHAI LA VIE -->
    <rect x="155" y="200" width="90" height="75" fill="url(#labelLaVie)"/>
    <!-- Vệt núi tuyết trắng trên nhãn -->
    <path d="M 155 235 Q 200 215 245 235 L 245 275 L 155 275 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M 185 240 L 200 220 L 215 240 Z" fill="#ef4444"/>

    <!-- CHỮ LA VIE -->
    <text x="200" y="258" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#0369a1" text-anchor="middle" font-style="italic">LaVie</text>
    <text x="200" y="270" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1">NATURAL WATER</text>

    <!-- ÁNH SÁNG PHẢN CHIẾU THÀNH CHAI -->
    <path d="M 162 135 L 162 315" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>