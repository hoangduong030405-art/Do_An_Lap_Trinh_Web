<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="monsterBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="20%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="80%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="metalMonster" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadowMonster" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.3"/>
    </filter>
  </defs>

  <ellipse cx="200" cy="340" rx="75" ry="14" fill="#000000" opacity="0.3"/>

  <g filter="url(#shadowMonster)">
    <!-- ĐỈNH LON KIM LOẠI ĐEN -->
    <ellipse cx="200" cy="72" rx="48" ry="10" fill="url(#metalMonster)"/>
    <ellipse cx="200" cy="70" rx="42" ry="7" fill="#1e293b"/>

    <!-- THÂN LON SƠN ĐEN MỜ -->
    <path d="M 152 72 L 150 310 Q 150 324 168 324 L 232 324 Q 250 324 250 310 L 248 72 Z" fill="url(#monsterBody)"/>
    <!-- ĐÁY LON -->
    <path d="M 160 322 Q 200 330 240 322 L 236 332 Q 200 338 164 332 Z" fill="url(#metalMonster)"/>

    <!-- MONSTER GREEN CLAW M LOGO (CÀO XANH NEON ĐẶC TRƯNG) -->
    <g transform="translate(200, 175) scale(1.15)">
      <!-- Vết cào trái -->
      <path d="M -26 -50 L -22 -20 L -30 20 L -24 45 L -20 40 L -22 15 L -16 -20 L -20 -50 Z" fill="#22c55e"/>
      <!-- Vết cào giữa -->
      <path d="M -4 -60 L 4 -60 L 6 -15 L -2 25 L 4 55 L -3 50 L -8 20 L -1 -15 Z" fill="#4ade80"/>
      <!-- Vết cào phải -->
      <path d="M 20 -48 L 24 -15 L 16 18 L 24 42 L 18 45 L 12 15 L 18 -18 L 15 -48 Z" fill="#22c55e"/>
    </g>

    <!-- CHỮ MONSTER ENERGY -->
    <text x="200" y="275" font-family="'Impact', Arial Black, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">MONSTER</text>
    <text x="200" y="292" font-family="'Arial', sans-serif" font-size="9" font-weight="700" fill="#22c55e" text-anchor="middle" letter-spacing="4">ENERGY</text>
  </g>
</svg>