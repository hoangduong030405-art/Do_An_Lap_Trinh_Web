<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="boxBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="30%" stop-color="#292524"/>
      <stop offset="70%" stop-color="#44403c"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="redStripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- NỀN TRANG TRÍ -->
  <rect width="400" height="400" rx="24" fill="url(#bgG7)"/>
  
  <!-- BÓNG ĐỔ HỘP -->
  <ellipse cx="200" cy="336" rx="90" ry="16" fill="#000000" opacity="0.22"/>

  <!-- HỘP CÀ PHÊ G7 3IN1 -->
  <g filter="url(#shadow)">
    <!-- Thân hộp chính chữ nhật bo góc nhẹ -->
    <rect x="125" y="86" width="150" height="236" rx="10" fill="url(#boxBody)"/>

    <!-- Dải sọc đỏ đặc trưng G7 Trung Nguyên -->
    <path d="M 125 140 L 275 125 L 275 165 L 125 180 Z" fill="url(#redStripe)"/>

    <!-- LOGO G7 NỔI TIẾNG -->
    <text x="200" y="162" font-family="'Impact', 'Arial Black', sans-serif" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">G7</text>
    <text x="200" y="174" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="2">COFFEE</text>

    <!-- NHÃN TRUNG NGUYÊN -->
    <text x="200" y="112" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#f59e0b" text-anchor="middle" letter-spacing="1.5">TRUNG NGUYÊN</text>
    <text x="200" y="125" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="600" fill="#a8a29e" text-anchor="middle">THỨ THIỆT TỪ VIỆT NAM</text>

    <!-- TÁCH CÀ PHÊ BỐC KHÓI -->
    <!-- Đĩa lót tách -->
    <ellipse cx="200" cy="275" rx="42" ry="9" fill="#78350f"/>
    <!-- Tách sứ trắng -->
    <path d="M 172 250 Q 170 270 190 272 L 210 272 Q 230 270 228 250 Z" fill="#ffffff"/>
    <ellipse cx="200" cy="250" rx="28" ry="7" fill="#451a03"/>
    <!-- Quai tách -->
    <path d="M 226 254 Q 236 258 226 266" stroke="#ffffff" stroke-width="3" fill="none"/>
    <!-- Làn khói thơm -->
    <path d="M 194 242 Q 190 232 196 224 Q 202 216 198 206" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 204 242 Q 208 232 202 224 Q 196 216 200 206" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- QUY CÁCH 3IN1 -->
    <rect x="155" y="292" width="90" height="20" rx="10" fill="#dc2626"/>
    <text x="200" y="306" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">3 IN 1 - 18 GÓI</text>
  </g>

  <!-- HUY HIỆU QUY CÁCH ĐÓNG THÙNG B2B -->
  <g transform="translate(20, 20)">
    <rect width="130" height="28" rx="14" fill="#78350f"/>
    <text x="65" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">THÙNG 24 HỘP</text>
  </g>
  <g transform="translate(280, 20)">
    <rect width="100" height="28" rx="14" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
    <text x="330" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#9a3412" text-anchor="middle">G7 THƯƠNG HIỆU</text>
  </g>
</svg>