<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="metalTin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="30%" stop-color="#e2e8f0"/>
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="redOngTho" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="35%" stop-color="#dc2626"/>
      <stop offset="70%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="shadowTin" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.25"/>
    </filter>
  </defs>

  <ellipse cx="200" cy="340" rx="85" ry="16" fill="#000000" opacity="0.22"/>

  <!-- HỘP SỮA ĐẶC ÔNG THỌ ĐỎ TRÒN TRUYỀN THỐNG 380G -->
  <g filter="url(#shadowTin)">
    <!-- Nắp hộp kim loại có viền dập -->
    <ellipse cx="200" cy="110" rx="75" ry="18" fill="url(#metalTin)"/>
    <ellipse cx="200" cy="108" rx="70" ry="15" fill="#f1f5f9"/>
    <!-- Vòng tròn tâm nắp -->
    <ellipse cx="200" cy="108" rx="35" ry="8" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Thân hộp kim loại dán nhãn đỏ -->
    <path d="M 125 110 L 125 300 Q 125 320 200 320 Q 275 320 275 300 L 275 110 Z" fill="url(#metalTin)"/>
    <!-- Vùng dán nhãn giấy đỏ -->
    <rect x="125" y="130" width="150" height="160" fill="url(#redOngTho)"/>

    <!-- Đáy hộp kim loại -->
    <path d="M 125 300 Q 200 322 275 300 L 275 306 Q 200 328 125 306 Z" fill="url(#metalTin)"/>

    <!-- KHUNG HÌNH ÔNG THỌ VÀNG KIM TRUNG TÂM -->
    <g transform="translate(200, 200)">
      <circle cx="0" cy="0" r="42" fill="#facc15" stroke="#ffffff" stroke-width="2"/>
      <circle cx="0" cy="0" r="38" fill="#fef08a"/>

      <!-- HỌA TIẾT ÔNG THỌ RÂU BẠC CẦM TRÁI ĐÀO TIÊN -->
      <!-- Khuôn mặt & nụ cười hiền hậu -->
      <circle cx="0" cy="-6" r="16" fill="#fbcfe8"/>
      <!-- Chòm râu trắng dài của Ông Thọ -->
      <path d="M -12 -2 Q 0 25 12 -2 Q 6 15 0 22 Q -6 15 -12 -2 Z" fill="#ffffff"/>
      <!-- Trán cao & nón tiên -->
      <ellipse cx="0" cy="-14" rx="14" ry="7" fill="#f43f5e"/>
      <!-- Quả đào tiên hồng trên tay -->
      <path d="M 8 10 Q 18 5 20 18 Q 12 25 8 10 Z" fill="#f43f5e"/>
    </g>

    <!-- CHỮ ÔNG THỌ TRẮNG VIỀN VÀNG -->
    <text x="200" y="155" font-family="'Impact', Arial Black, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">ÔNG THỌ</text>
    <text x="200" y="265" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="900" fill="#facc15" text-anchor="middle">SỮA ĐẶC CÓ ĐƯỜNG</text>
    <text x="200" y="280" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">VINAMILK • HỘP 380g</text>
  </g>
</svg>