<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgVinamilk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="milkBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadowMilk" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.2"/>
    </filter>
  </defs>


  <!-- BÓNG ĐỔ HỘP SỮA -->
  <ellipse cx="200" cy="340" rx="80" ry="14" fill="#000000" opacity="0.18"/>

  <!-- LỐC 4 HỘP SỮA TƯƠI VINAMILK 100% (HIỂN THỊ HỘP ĐẠI DIỆN 3D) -->
  <g filter="url(#shadowMilk)">
    <!-- Hộp phía sau (tạo hiệu ứng lốc 4 hộp) -->
    <rect x="175" y="90" width="95" height="210" rx="8" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 175 90 L 195 70 L 290 70 L 270 90 Z" fill="#cbd5e1"/>
    <path d="M 270 90 L 290 70 L 290 280 L 270 300 Z" fill="#94a3b8"/>

    <!-- Hộp chính phía trước -->
    <rect x="130" y="110" width="125" height="215" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
    
    <!-- Đầu hộp gấp Tetra Pak đặc trưng -->
    <path d="M 130 110 L 155 85 L 280 85 L 255 110 Z" fill="#f8fafc" stroke="#bae6fd" stroke-width="1.5"/>
    <!-- Nắp vặn sữa hoặc lỗ cắm ống hút -->
    <circle cx="175" cy="98" r="8" fill="#0284c7"/>
    <circle cx="175" cy="98" r="4" fill="#ffffff"/>

    <!-- PHẦN THIẾT KẾ THÂN HỘP SỮA VINAMILK -->
    <!-- Dải màu xanh dương Vinamilk trên đỉnh -->
    <rect x="131" y="111" width="123" height="55" fill="url(#milkBlue)"/>
    
    <text x="192" y="136" font-family="'Arial Black', Impact, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">VINAMILK</text>
    <text x="192" y="152" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="1">100% SỮA TƯƠI</text>

    <!-- Thân giữa trắng sữa tinh khiết -->
    <rect x="131" y="166" width="123" height="65" fill="#ffffff"/>
    <text x="192" y="186" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" fill="#0369a1" text-anchor="middle">TIỆT TRÙNG</text>
    <text x="192" y="202" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#0284c7" text-anchor="middle">CÓ ĐƯỜNG</text>

    <!-- Thảm cỏ xanh & Bò sữa Vinamilk bên dưới -->
    <path d="M 131 230 Q 192 220 254 230 L 254 324 Q 254 325 247 325 L 138 325 Q 131 325 131 324 Z" fill="#22c55e"/>
    
    <!-- Hình minh họa bò sữa đốm đen trắng đáng yêu -->
    <g transform="translate(192, 265) scale(0.8)">
      <ellipse cx="0" cy="0" rx="22" ry="14" fill="#ffffff"/>
      <!-- Đốm đen -->
      <circle cx="-6" cy="-4" r="6" fill="#1e293b"/>
      <circle cx="8" cy="2" r="5" fill="#1e293b"/>
      <!-- Đầu bò -->
      <circle cx="-20" cy="-8" r="9" fill="#ffffff"/>
      <ellipse cx="-23" cy="-5" rx="5" ry="4" fill="#fbcfe8"/>
      <circle cx="-22" cy="-9" r="1.5" fill="#000000"/>
      <!-- Chân bò -->
      <rect x="-14" y="10" width="4" height="12" rx="2" fill="#ffffff"/>
      <rect x="8" y="10" width="4" height="12" rx="2" fill="#ffffff"/>
    </g>

    <text x="192" y="315" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">4 x 180 ml</text>
  </g>

</svg>
