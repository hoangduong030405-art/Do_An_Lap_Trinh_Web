<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="chiliSauce" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="35%" stop-color="#dc2626"/>
      <stop offset="70%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="shadowChili" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.25"/>
    </filter>
  </defs>

  <ellipse cx="200" cy="345" rx="65" ry="12" fill="#000000" opacity="0.2"/>

  <!-- CHAI TƯƠNG ỚT CHIN-SU THÂN CONG BẦU ĐỎ RỰC -->
  <g filter="url(#shadowChili)">
    <!-- Nắp trắng nhỏ có vòi rót đỏ -->
    <path d="M 195 55 L 205 55 L 202 42 L 198 42 Z" fill="#ef4444"/>
    <rect x="188" y="55" width="24" height="22" rx="3" fill="#f8fafc"/>
    <line x1="188" y1="64" x2="212" y2="64" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Thân chai nhựa cong mềm đặc trưng Chin-su -->
    <path d="M 190 77 L 180 125 Q 150 160 155 220 Q 158 290 170 325 Q 175 335 200 335 Q 225 335 230 325 Q 242 290 245 220 Q 250 160 220 125 L 210 77 Z" fill="url(#chiliSauce)"/>

    <!-- Vệt sáng phản chiếu độ bóng tương ớt -->
    <path d="M 168 150 Q 166 220 178 300" stroke="#fca5a5" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>

    <!-- NHÃN CHINSU TRÊN THÂN CHAI -->
    <g transform="translate(160, 170)">
      <rect x="0" y="0" width="80" height="90" rx="6" fill="#1e293b"/>
      <rect x="3" y="3" width="74" height="84" rx="4" fill="#0f172a" stroke="#eab308" stroke-width="1.5"/>

      <!-- LOGO CHIN-SU VÀNG NỔI BẬT -->
      <text x="40" y="28" font-family="'Impact', Arial Black, sans-serif" font-size="18" font-weight="900" fill="#facc15" text-anchor="middle" letter-spacing="1">CHIN-SU</text>
      <text x="40" y="44" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">TƯƠNG ỚT</text>
      
      <!-- HÌNH TRÁI ỚT ĐỎ CAY NỒNG -->
      <path d="M 30 65 Q 40 48 55 52 Q 45 68 30 65 Z" fill="#ef4444"/>
      <path d="M 55 52 Q 58 48 60 50" stroke="#22c55e" stroke-width="2" fill="none"/>

      <text x="40" y="78" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="700" fill="#fde047" text-anchor="middle">VẠN MÓN NGON BÙNG VỊ</text>
    </g>
  </g>
</svg>