<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgChoco" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="chocoBox" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="35%" stop-color="#dc2626"/>
      <stop offset="70%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="chocoCake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#3b1502"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- NỀN TRANG TRÍ -->
  <rect width="400" height="400" rx="24" fill="url(#bgChoco)"/>
  
  <!-- BÓNG ĐỔ HỘP -->
  <ellipse cx="200" cy="336" rx="96" ry="16" fill="#000000" opacity="0.2"/>

  <!-- HỘP BÁNH CHOCOPIE ORION -->
  <g filter="url(#shadow)">
    <!-- Hộp chữ nhật ngang chuẩn bánh quy -->
    <rect x="105" y="92" width="190" height="230" rx="12" fill="url(#chocoBox)"/>

    <!-- LOGO ORION ĐẦU HỘP -->
    <ellipse cx="200" cy="118" rx="36" ry="14" fill="#ffffff"/>
    <text x="200" y="123" font-family="'Impact', 'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#dc2626" text-anchor="middle" letter-spacing="1">ORION</text>

    <!-- CHỮ CHOCOPIE CỰC ĐẸP TRÊN THÂN HỘP -->
    <text x="200" y="156" font-family="'Brush Script MT', 'Segoe Script', cursive, sans-serif" font-size="34" font-weight="bold" fill="#fef08a" text-anchor="middle">Choco·Pie</text>
    <text x="200" y="172" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">TÌNH</text>

    <!-- BÁNH CHOCOPIE PHỦ SOCOLA VỚI NHÂN MARSHMALLOW DẺO -->
    <!-- Bánh tròn phủ socola nâu bóng -->
    <circle cx="200" cy="235" r="46" fill="url(#chocoCake)"/>
    <!-- Vệt bóng ánh sáng socola -->
    <ellipse cx="188" cy="210" rx="20" ry="8" fill="#a16207" opacity="0.6"/>

    <!-- LỚP KEM MARSHMALLOW TRẮNG DẺO XỐP Ở GIỮA -->
    <path d="M 160 235 Q 200 246 240 235 Q 242 244 236 248 Q 200 256 164 248 Z" fill="#ffffff"/>

    <!-- BÁNH THỨ 2 LẤP LÓ PHÍA SAU -->
    <circle cx="152" cy="254" r="26" fill="#582208" opacity="0.85"/>
    <path d="M 132 254 Q 152 260 172 254" stroke="#ffffff" stroke-width="4" fill="none"/>

    <!-- QUY CÁCH HỘP 12 CÁI -->
    <rect x="145" y="292" width="110" height="20" rx="10" fill="#fef08a"/>
    <text x="200" y="306" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#991b1b" text-anchor="middle">HỘP 12 CÁI (396g)</text>
  </g>

  <!-- HUY HIỆU QUY CÁCH ĐÓNG THÙNG B2B -->
  <g transform="translate(20, 20)">
    <rect width="130" height="28" rx="14" fill="#be123c"/>
    <text x="65" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">THÙNG 8 HỘP</text>
  </g>
  <g transform="translate(280, 20)">
    <rect width="100" height="28" rx="14" fill="#ffffff" stroke="#fecdd3" stroke-width="1.5"/>
    <text x="330" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#be123c" text-anchor="middle">ORION CHÍNH HÃNG</text>
  </g>
</svg>