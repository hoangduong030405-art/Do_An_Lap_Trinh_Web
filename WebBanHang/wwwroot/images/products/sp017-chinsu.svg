<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sauceLiquid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="30%" stop-color="#292524"/>
      <stop offset="60%" stop-color="#44403c"/>
      <stop offset="85%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <filter id="shadowChinsu" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- BÓNG ĐỔ CHAI -->
  <ellipse cx="200" cy="345" rx="65" ry="14" fill="#000000" opacity="0.2"/>

  <!-- CHAI NƯỚC TƯƠNG CHINSU TỎI ỚT 330ML -->
  <g filter="url(#shadowChinsu)">
    <!-- Nắp bật màu đỏ Chinsu đặc trưng -->
    <rect x="188" y="55" width="24" height="22" rx="4" fill="#dc2626"/>
    <ellipse cx="200" cy="55" rx="12" ry="4" fill="#ef4444"/>
    <rect x="185" y="73" width="30" height="5" fill="#b91c1c"/>

    <!-- Thân chai nước tương thon cổ cao -->
    <path d="M 190 78 L 186 115 Q 160 145 160 180 L 160 315 Q 160 330 178 330 L 222 330 Q 240 330 240 315 L 240 180 Q 240 145 214 115 L 210 78 Z" fill="url(#sauceLiquid)"/>

    <!-- Vệt sáng phản chiếu thủy tinh -->
    <path d="M 168 180 L 168 310" stroke="#ffffff" stroke-width="4.5" opacity="0.25" stroke-linecap="round"/>

    <!-- NHÃN CHAI NƯỚC TƯƠNG CHINSU MÀU ĐỎ ĐEN -->
    <g transform="translate(160, 180)">
      <rect x="0" y="0" width="80" height="115" rx="4" fill="#7f1d1d" stroke="#f59e0b" stroke-width="1.5"/>
      <rect x="0" y="0" width="80" height="42" fill="#991b1b"/>
      
      <!-- LOGO CHINSU -->
      <text x="40" y="24" font-family="'Arial Black', Impact, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">CHIN-SU</text>
      <text x="40" y="37" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold" fill="#fef08a" text-anchor="middle">KIỆT TÁC</text>

      <!-- DÒNG CHỮ NƯỚC TƯƠNG TỎI ỚT -->
      <rect x="4" y="46" width="72" height="22" rx="3" fill="#1c1917"/>
      <text x="40" y="58" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="900" fill="#ffffff" text-anchor="middle">NƯỚC TƯƠNG</text>
      <text x="40" y="66" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="bold" fill="#ef4444" text-anchor="middle">TỎI ỚT</text>

      <!-- MINH HỌA TỎI VÀ ỚT ĐỎ TƯƠI -->
      <g transform="translate(40, 92)">
        <!-- Quả ớt đỏ -->
        <path d="M -12 10 Q 0 -5 12 5 Q 0 12 -12 10 Z" fill="#dc2626"/>
        <path d="M 12 5 Q 16 0 18 -4" stroke="#15803d" stroke-width="1.5" fill="none"/>
        <!-- Tép tỏi trắng ngà -->
        <circle cx="-2" cy="0" r="7" fill="#fef08a" stroke="#ca8a04" stroke-width="0.8"/>
      </g>
    </g>

    <!-- DUNG TÍCH 330ML -->
    <text x="200" y="318" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold" fill="#d6d3d1" text-anchor="middle">330 ml</text>
  </g>
</svg>
