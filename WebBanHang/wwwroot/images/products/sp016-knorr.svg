<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="packKnorr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="yellowKnorr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadowKnorr" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- BÓNG ĐỔ GÓI HẠT NÊM -->
  <ellipse cx="200" cy="345" rx="100" ry="16" fill="#000000" opacity="0.2"/>

  <!-- GÓI HẠT NÊM KNORR 900G -->
  <g filter="url(#shadowKnorr)">
    <!-- Túi bao bì đứng hình thang bo góc -->
    <path d="M 120 70 L 280 70 L 295 320 Q 295 330 280 330 L 120 330 Q 105 330 105 320 Z" fill="url(#packKnorr)"/>

    <!-- Viền ép nhiệt miệng túi ở trên -->
    <rect x="115" y="70" width="170" height="18" fill="#14532d" stroke="#16a34a" stroke-width="1"/>
    <line x1="120" y1="78" x2="280" y2="78" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4 2"/>

    <!-- LOGO KNORR ĐẶC TRƯNG (CHỮ TRẮNG NỀN ĐỎ VIỀN VÀNG) -->
    <g transform="translate(200, 130)">
      <ellipse cx="0" cy="0" rx="60" ry="26" fill="#dc2626" stroke="url(#yellowKnorr)" stroke-width="3"/>
      <text x="0" y="8" font-family="'Brush Script MT', 'Segoe Script', cursive, sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">Knorr</text>
    </g>

    <!-- BANNER VÀNG RỰC RỠ: THỊT THĂN & XƯƠNG ỐNG -->
    <path d="M 105 175 L 295 175 L 285 220 L 115 220 Z" fill="url(#yellowKnorr)"/>
    <text x="200" y="196" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#14532d" text-anchor="middle">HẠT NÊM TỪ</text>
    <text x="200" y="214" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" fill="#dc2626" text-anchor="middle">THỊT THĂN, XƯƠNG ỐNG &amp; TỦY</text>

    <!-- MUỖNG MÚC HẠT NÊM VÀNG ÓNG VÀ NẤM HƯƠNG MINH HỌA -->
    <g transform="translate(200, 265)">
      <!-- Tô/Đĩa súp ngọt thanh -->
      <ellipse cx="0" cy="15" rx="55" ry="18" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
      <ellipse cx="0" cy="12" rx="45" ry="12" fill="#f59e0b" opacity="0.6"/>
      <!-- Miếng thịt & nấm hương -->
      <circle cx="-15" cy="10" r="8" fill="#b91c1c"/>
      <ellipse cx="12" cy="11" rx="10" ry="6" fill="#78350f"/>
    </g>

    <!-- TRỌNG LƯỢNG 900G GÓC DƯỚI -->
    <rect x="225" y="295" width="55" height="22" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
    <text x="252" y="311" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="900" fill="#14532d" text-anchor="middle">900 g</text>
  </g>
</svg>
