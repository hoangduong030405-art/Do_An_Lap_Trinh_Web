<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTiger" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="crystalSilver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="25%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="tigerBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadowTiger" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- NỀN TRANG TRÍ -->
  <rect width="400" height="400" rx="24" fill="url(#bgTiger)"/>
  
  <!-- BÓNG ĐỔ LON -->
  <ellipse cx="200" cy="340" rx="75" ry="14" fill="#000000" opacity="0.2"/>

  <!-- THÂN LON BIA TIGER CRYSTAL BẠC ÁNH XANH -->
  <g filter="url(#shadowTiger)">
    <!-- Đỉnh lon kim loại -->
    <ellipse cx="200" cy="72" rx="48" ry="10" fill="url(#crystalSilver)"/>
    <ellipse cx="200" cy="70" rx="42" ry="7" fill="#e2e8f0"/>
    <ellipse cx="200" cy="69" rx="16" ry="4" fill="#94a3b8"/>
    <circle cx="206" cy="69" r="3" fill="#64748b"/>

    <!-- Thân lon bạc thon sang trọng -->
    <path d="M 152 72 L 150 310 Q 150 324 168 324 L 232 324 Q 250 324 250 310 L 248 72 Z" fill="url(#crystalSilver)"/>

    <!-- Đáy lon -->
    <path d="M 160 322 Q 200 330 240 322 L 236 332 Q 200 338 164 332 Z" fill="url(#crystalSilver)"/>

    <!-- Dải xanh dương đậm Tiger ở cổ lon -->
    <path d="M 152 95 L 248 95 L 248 115 L 152 115 Z" fill="url(#tigerBlue)"/>

    <!-- HÌNH CON HỔ TIGER VÀNG CAM OAI PHONG -->
    <g transform="translate(200, 150) scale(0.9)">
      <circle cx="0" cy="0" r="22" fill="#ea580c"/>
      <path d="M -15 -8 Q 0 -22 15 -8 Q 12 12 -15 -8 Z" fill="#ffffff"/>
      <polygon points="-8,-4 0,6 8,-4" fill="#1e293b"/>
      <circle cx="-5" cy="-6" r="2" fill="#1e293b"/>
      <circle cx="5" cy="-6" r="2" fill="#1e293b"/>
    </g>

    <!-- CHỮ TIGER ĐẬM NỔI BẬT DỌC THÂN LON -->
    <g transform="translate(182, 235) rotate(-90)">
      <text x="0" y="0" font-family="'Arial Black', Impact, sans-serif" font-size="28" font-weight="900" fill="#1e3a8a" letter-spacing="2">Tiger</text>
    </g>

    <!-- CHỮ CRYSTAL XANH BĂNG NỔI BẬT -->
    <text x="200" y="270" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#0284c7" text-anchor="middle" letter-spacing="2">CRYSTAL</text>
    <text x="200" y="286" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="bold" fill="#64748b" text-anchor="middle" letter-spacing="1">COLD FILTERED BEER</text>
    <text x="200" y="306" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">330 ml</text>
  </g>

  <!-- HUY HIỆU QUY CÁCH B2B -->
  <g transform="translate(20, 20)">
    <rect width="130" height="28" rx="14" fill="#1e3a8a"/>
    <text x="65" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">THÙNG 24 LON</text>
  </g>
  <g transform="translate(265, 20)">
    <rect width="115" height="28" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="322" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="middle">TIGER CRYSTAL</text>
  </g>
</svg>
