<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAqua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="waterBottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="30%" stop-color="#dbeafe"/>
      <stop offset="70%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="aquaBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="shadowAqua" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- NỀN TRANG TRÍ -->
  <rect width="400" height="400" rx="24" fill="url(#bgAqua)"/>
  
  <!-- BÓNG ĐỔ CHAI NƯỚC -->
  <ellipse cx="200" cy="345" rx="50" ry="12" fill="#000000" opacity="0.18"/>

  <!-- CHAI NƯỚC TINH KHIẾT AQUAFINA 500ML -->
  <g filter="url(#shadowAqua)">
    <!-- Nắp chai xanh dương -->
    <rect x="188" y="58" width="24" height="20" rx="3" fill="#2563eb"/>
    <rect x="185" y="74" width="30" height="5" rx="2" fill="#1d4ed8"/>

    <!-- Thân chai nước trong suốt gợn sóng -->
    <path d="M 191 79 L 191 100 L 165 135 L 165 200 L 168 215 L 165 230 L 165 330 Q 165 340 175 340 L 225 340 Q 235 340 235 330 L 235 230 L 232 215 L 235 200 L 235 135 L 209 100 L 209 79 Z" fill="url(#waterBottle)"/>
    
    <!-- Ánh sáng phản chiếu chai nước trong vắt -->
    <path d="M 172 140 L 172 325" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.75"/>

    <!-- NHÃN CHAI NƯỚC AQUAFINA MÀU XANH DƯƠNG -->
    <rect x="165" y="165" width="70" height="85" rx="4" fill="url(#aquaBlue)"/>
    
    <!-- Biểu tượng đỉnh núi tuyết & mặt trời đỏ Aquafina -->
    <circle cx="200" cy="180" r="10" fill="#ef4444"/>
    <polygon points="190,192 200,182 210,192" fill="#ffffff"/>
    <polygon points="182,192 192,185 202,192" fill="#e2e8f0"/>

    <text x="200" y="208" font-family="'Arial Black', Impact, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">AQUAFINA</text>
    <text x="200" y="222" font-family="'Segoe UI', sans-serif" font-size="6.5" font-weight="bold" fill="#bfdbfe" text-anchor="middle" letter-spacing="1">PURIFIED WATER</text>
    <text x="200" y="238" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="900" fill="#ffffff" text-anchor="middle">500 ml</text>
  </g>

  <!-- HUY HIỆU QUY CÁCH B2B -->
  <g transform="translate(20, 20)">
    <rect width="130" height="28" rx="14" fill="#2563eb"/>
    <text x="65" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">THÙNG 24 CHAI</text>
  </g>
  <g transform="translate(265, 20)">
    <rect width="115" height="28" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="322" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">AQUAFINA 500ML</text>
  </g>
</svg>
