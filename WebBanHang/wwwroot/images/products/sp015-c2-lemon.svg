<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="teaLiquid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="30%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="c2Yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadowC2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- BÓNG ĐỔ CHAI -->
  <ellipse cx="200" cy="345" rx="65" ry="14" fill="#000000" opacity="0.2"/>

  <!-- CHAI TRÀ XANH C2 HƯƠNG CHANH -->
  <g filter="url(#shadowC2)">
    <!-- Nắp chai màu xanh lá URC -->
    <rect x="186" y="55" width="28" height="20" rx="3" fill="#15803d"/>
    <ellipse cx="200" cy="55" rx="14" ry="4" fill="#22c55e"/>

    <!-- Cổ chai -->
    <path d="M 188 75 L 184 105 Q 160 135 160 160 L 160 315 Q 160 330 178 330 L 222 330 Q 240 330 240 315 L 240 160 Q 240 135 216 105 L 212 75 Z" fill="url(#teaLiquid)"/>

    <!-- Vệt sáng phản chiếu chai nhựa PET -->
    <path d="M 168 150 L 168 310" stroke="#ffffff" stroke-width="6" opacity="0.4" stroke-linecap="round"/>

    <!-- NHÃN THÂN CHAI C2 VÀNG RỰC RỠ -->
    <g transform="translate(160, 165)">
      <rect x="0" y="0" width="80" height="110" rx="4" fill="url(#c2Yellow)" stroke="#15803d" stroke-width="1.5"/>
      
      <!-- Viền xanh lá trên và dưới nhãn -->
      <rect x="0" y="0" width="80" height="8" fill="#15803d"/>
      <rect x="0" y="102" width="80" height="8" fill="#15803d"/>
      
      <!-- LOGO C2 NỔI TIẾNG -->
      <circle cx="40" cy="45" r="24" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
      <text x="40" y="55" font-family="'Arial Black', Impact, sans-serif" font-size="28" font-weight="900" fill="#dc2626" text-anchor="middle" letter-spacing="-1">C2</text>

      <!-- DÒNG CHỮ TRÀ XANH CHANH -->
      <text x="40" y="80" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="900" fill="#15803d" text-anchor="middle">TRÀ XANH</text>
      <text x="40" y="94" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold" fill="#78350f" text-anchor="middle">HƯƠNG CHANH</text>
    </g>

    <!-- HÌNH LÁ TRÀ VÀ LÁT CHANH NHỎ -->
    <g transform="translate(200, 300)">
      <circle cx="-12" cy="0" r="10" fill="#facc15" stroke="#ca8a04" stroke-width="1"/>
      <path d="M 0 5 Q 15 -5 18 -12 Q 10 8 0 5 Z" fill="#22c55e"/>
    </g>
  </g>
</svg>
