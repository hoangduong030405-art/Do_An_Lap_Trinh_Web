<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgNamNgu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="sauceLiquid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="30%" stop-color="#b45309"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="90%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="bottleCap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- NỀN TRANG TRÍ -->
  <rect width="400" height="400" rx="24" fill="url(#bgNamNgu)"/>
  
  <!-- BÓNG ĐỔ CHAI -->
  <ellipse cx="200" cy="342" rx="65" ry="13" fill="#000000" opacity="0.22"/>

  <!-- CHAI NƯỚC MẮM NAM NGƯ 900ML -->
  <g filter="url(#shadow)">
    <!-- Nắp chai đỏ viền gân -->
    <rect x="186" y="66" width="28" height="20" rx="4" fill="url(#bottleCap)"/>
    <ellipse cx="200" cy="66" rx="14" ry="4" fill="#dc2626"/>

    <!-- Cổ chai thủy tinh trong suốt -->
    <path d="M 190 86 L 188 125 L 160 170 L 160 316 Q 160 328 175 328 L 225 328 Q 240 328 240 316 L 240 170 L 212 125 L 210 86 Z" fill="url(#sauceLiquid)"/>

    <!-- Vệt sáng thủy tinh phản chiếu ánh hổ phách -->
    <path d="M 166 180 L 166 314" stroke="#fde68a" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M 174 180 L 174 314" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

    <!-- NHÃN CHAI NƯỚC MẮM (ĐỎ & VÀNG) -->
    <rect x="160" y="180" width="80" height="96" fill="#dc2626" rx="4"/>
    
    <!-- CHỮ NAM NGƯ -->
    <rect x="164" y="188" width="72" height="24" rx="3" fill="#fef08a"/>
    <text x="200" y="205" font-family="'Impact', 'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#991b1b" text-anchor="middle" letter-spacing="1">NAM NGƯ</text>
    <text x="200" y="222" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">ĐỆ NHỊ</text>

    <!-- HÌNH CON CÁ CƠM TƯỢNG TRƯNG MÀU VÀNG KIM -->
    <path d="M 180 235 Q 200 228 220 235 Q 212 240 220 245 Q 200 242 180 235 Z" fill="#fef08a"/>
    <circle cx="186" cy="235" r="1.5" fill="#991b1b"/>

    <!-- DUNG TÍCH 900ML -->
    <text x="200" y="264" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#fde68a" text-anchor="middle">900 ML</text>
  </g>

  <!-- HUY HIỆU QUY CÁCH ĐÓNG THÙNG B2B -->
  <g transform="translate(20, 20)">
    <rect width="130" height="28" rx="14" fill="#b45309"/>
    <text x="65" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">THÙNG 15 CHAI</text>
  </g>
  <g transform="translate(270, 20)">
    <rect width="110" height="28" rx="14" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
    <text x="325" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">NAM NGƯ 900ML</text>
  </g>
</svg>