<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="kokomiBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="shadowKokomi" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity="0.25"/>
    </filter>
  </defs>

  <ellipse cx="200" cy="345" rx="90" ry="16" fill="#000000" opacity="0.2"/>

  <!-- GÓI MÌ KOKOMI ĐẠI 90G -->
  <g filter="url(#shadowKokomi)">
    <!-- Răng cưa viền mép gói mì trên & dưới -->
    <path d="M 115 100 L 285 100 L 280 115 L 285 130 L 280 145 L 285 160 L 280 175 L 285 190 L 280 205 L 285 220 L 280 235 L 285 250 L 280 265 L 285 280 L 280 295 L 285 310 L 115 310 L 120 295 L 115 280 L 120 265 L 115 250 L 120 235 L 115 220 L 120 205 L 115 190 L 120 175 L 115 160 L 120 145 L 115 130 L 120 115 Z" fill="url(#kokomiBg)"/>

    <!-- BADGE ĐẠI 90G MÀU ĐỎ VIỀN VÀNG -->
    <g transform="translate(145, 130)">
      <circle cx="0" cy="0" r="22" fill="#dc2626" stroke="#facc15" stroke-width="3"/>
      <text x="0" y="-3" font-family="'Impact', Arial Black, sans-serif" font-size="12" font-weight="900" fill="#facc15" text-anchor="middle">ĐẠI</text>
      <text x="0" y="11" font-family="'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">90g</text>
    </g>

    <!-- LOGO KOKOMI -->
    <text x="215" y="155" font-family="'Impact', Arial Black, sans-serif" font-size="34" font-weight="900" fill="#fef08a" stroke="#b45309" stroke-width="1.5" letter-spacing="1">KOKOMI</text>
    <rect x="140" y="172" width="120" height="20" rx="4" fill="#facc15"/>
    <text x="200" y="186" font-family="'Arial Black', sans-serif" font-size="11" font-weight="900" fill="#b91c1c" text-anchor="middle">TÔM CHUA CAY</text>

    <!-- BÁT MÌ TÔM SỢI DAI VÀNG HẤP DẪN -->
    <g transform="translate(200, 240)">
      <!-- Tô mì đen -->
      <path d="M -60 0 Q 0 65 60 0 Z" fill="#1e293b"/>
      <ellipse cx="0" cy="0" rx="60" ry="14" fill="#334155"/>
      <!-- Nước súp đỏ tôm chua cay -->
      <ellipse cx="0" cy="2" rx="54" ry="10" fill="#dc2626"/>
      <!-- Tôm sú luộc cong đỏ cam -->
      <path d="M -20 -4 Q -10 -20 15 -10 Q 0 -5 -15 -2 Z" fill="#f97316"/>
      <!-- Sợi mì vàng óng -->
      <path d="M -30 2 Q -15 -8 5 0 Q 25 5 40 -2" stroke="#fef08a" stroke-width="3" fill="none"/>
      <path d="M -40 0 Q -20 8 10 4 Q 30 -4 45 2" stroke="#fde047" stroke-width="2.5" fill="none"/>
      <circle cx="-5" cy="-2" r="3" fill="#22c55e"/>
      <circle cx="20" cy="2" r="2.5" fill="#22c55e"/>
    </g>

    <text x="200" y="295" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">SỢI DAI DẺO • ĐẬM VỊ TÔM</text>
  </g>
</svg>